<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="45%" stop-color="#4f46e5" />
      <stop offset="80%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" />

  <!-- Inner Soft Ring -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.18" />

  <!-- House Silhouette with Glow -->
  <g filter="url(#glow)">
    <!-- House Roof and Body -->
    <path d="M 256 68 L 76 218 L 126 218 L 126 418 C 126 432 138 444 152 444 L 360 444 C 374 444 386 432 386 418 L 386 218 L 436 218 Z"
          fill="url(#houseGrad)" />
    <!-- Chimney -->
    <path d="M 334 116 L 372 116 L 372 176 L 334 144 Z" fill="url(#houseGrad)" />
  </g>

  <!-- Subtle House Floor/Door Ambient Arc -->
  <path d="M 172 444 C 172 380 340 380 340 444 Z" fill="#c7d2fe" fill-opacity="0.4" />

  <!-- Indian Rupee Symbol (₹) inside House (Vibrant Brand Gradient) -->
  <g fill="#4338ca">
    <!-- Top Bar -->
    <rect x="180" y="190" width="152" height="22" rx="11" />
    <!-- Second Bar -->
    <rect x="180" y="234" width="134" height="20" rx="10" />
    <!-- Vertical Spine -->
    <rect x="202" y="190" width="22" height="188" rx="11" />
    <!-- Loop Curve (Upper Arc) -->
    <path d="M 202 234 H 262 C 292 234 308 252 308 276 C 308 304 286 322 254 322 H 202 Z"
          fill="none" stroke="#4338ca" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Diagonal Leg -->
    <path d="M 238 316 L 308 398"
          stroke="#4338ca" stroke-width="24" stroke-linecap="round" />
  </g>
</svg>